
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Web2APK Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #eef3ff;
      background: linear-gradient(135deg, #080c17, #172b50);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #344663;
      border-radius: 22px;
      background: #111827;
      text-align: center;
    }
    h1 { color: #83aaff; }
    p { color: #aab8d0; line-height: 1.7; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      color: white;
      background: #527dff;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Web2APK Studio</h1>
    <p>Welcome! Your first website is ready.</p>
    <button onclick="alert('Web2APK is working!')">
      Test Website
    </button>
  </main>
</body>
</html>
